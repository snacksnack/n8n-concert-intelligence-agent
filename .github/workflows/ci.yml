name: CI

# CI only reads the repo; the default GITHUB_TOKEN write scopes are unused
# (CodeQL actions/missing-workflow-permissions, RC1-470).
permissions:
  contents: read

# RC1-258. Layer 1 reads the prompt and its consumer out of the committed
# workflow JSON and needs no credentials, so it gates on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # Layer 1: the prompt contract and the assumptions Attach Previews makes,
      # read out of the committed workflow JSON. No credentials, no tokens. The
      # billed half (`python -m evals`) is run by hand — see docs/rc1-258-evals.md.
      # RC1-452: --ddtrace reports test-level results to Test Optimization,
      # agentless. Until the DD_API_KEY secret exists here, the plugin logs
      # an error and runs the suite untouched — the check never weakens.
      # RC1-468: --cov adds line coverage; ddtrace reports it as
      # test.code_coverage.lines_pct. Coverage is a signal, not a gate — no
      # threshold fails this step.
      - name: Test (pytest)
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: n8n-concert-intelligence-agent
          DD_ENV: ci
        run: pytest --ddtrace --cov
