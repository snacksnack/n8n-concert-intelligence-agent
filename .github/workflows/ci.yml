name: CI

# RC1-258. Layer 1 reads the prompt and its consumer out of the committed
# workflow JSON and needs no credentials, so it gates on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # Layer 1: the prompt contract and the assumptions Attach Previews makes,
      # read out of the committed workflow JSON. No credentials, no tokens. The
      # billed half (`python -m evals`) is run by hand — see docs/rc1-258-evals.md.
      - name: Test (pytest)
        run: pytest
