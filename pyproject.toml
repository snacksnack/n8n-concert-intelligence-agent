# Tool configuration only — no `[project]` table. Nothing here is a package;
# the deployable artifact is the workflow JSON, which n8n Cloud runs.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
